name: chehel_hadith_app
description: "اپلیکیشن آفلاین چهل حدیث با شرح، برای اندروید (Flutter)"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: fonts/Vazirmatn-ExtraBold.ttf
          weight: 800

  assets:
    - assets/hadiths.json


